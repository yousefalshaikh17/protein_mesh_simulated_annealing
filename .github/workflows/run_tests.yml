name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Setup conda
      uses: conda-incubator/setup-miniconda@v2
      with:
        activate-environment: tetmesht
        environment-file: tetmesh_conda_env.yml
        auto-activate-base: true
        python-version: 3.9

    - name: Installing Python Libraries
      run: |
          conda run -n tetmesht pip install --editable . -v

    - name: Run unit tests
      run: |
          python -m unittest discover -s tetmeshtools/tests